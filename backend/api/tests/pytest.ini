[pytest]
# Run from the repo root or from backend/api: pytest backend/api/tests
# No pythonpath here on purpose: conftest.py puts backend/api on sys.path itself, AFTER importing moto
# (the handler's responses.py would otherwise shadow the "responses" package that moto needs).
testpaths = .
addopts = -ra
markers =
    security: authentication, authorization and ownership checks
filterwarnings =
    ignore::DeprecationWarning:botocore.*
    ignore::DeprecationWarning:moto.*
