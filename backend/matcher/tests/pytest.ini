[pytest]
# Run from the repo root or from backend/matcher:  pytest backend/matcher/tests
# Run it as its own pytest process, not together with backend/api/tests: both folders have flat
# modules with the same names (app.py, ...), which would shadow each other.
testpaths = .
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:botocore.*
    ignore::DeprecationWarning:moto.*
